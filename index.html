
<!DOCTYPE html>
<html ng-app="app">
<head>
    <title>Student Management</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="ctrl">

<h2>Student Management System</h2>

<!-- Student Form -->
<form ng-submit="save()">
    <input ng-model="s.name" placeholder="Name" required>
    <input ng-model="s.regNo" placeholder="Register No" required>
    <input ng-model="s.department" placeholder="Department" required>

    <button type="submit">{{edit ? 'Update' : 'Add'}}</button>
    <button type="button" ng-click="clear()">Clear</button>
</form>

<p>{{msg}}</p>

<!-- Student Table -->
<table border="1" cellpadding="5">
    <tr>
        <th>Name</th>
        <th>Register No</th>
        <th>Department</th>
        <th>Actions</th>
    </tr>

    <tr ng-repeat="x in list track by x._id">
        <td>{{x.name}}</td>
        <td>{{x.regNo}}</td>
        <td>{{x.department}}</td>
        <td>
            <button type="button" ng-click="editStudent(x)">Edit</button>
            <button type="button" ng-click="deleteStudent(x._id)">Delete</button>
        </td>
    </tr>
</table>

<script>
var app = angular.module('app', []);

app.controller('ctrl', function($scope, $http) {

    $scope.list = [];
    $scope.s = {};
    $scope.edit = false;

    // Get students
    $scope.load = function() {
        $http.get('/api/students').then(function(response) {
            $scope.list = response.data;
        });
    };

    // Add or Update student
    $scope.save = function() {

        if ($scope.edit) {
             $http.put('/api/students/' + $scope.s._id, $scope.s);
              $scope.load();
        } else {
            $http.post('/api/students', $scope.s);
              $scope.load();
        }     
    };

    // Select student for editing
    $scope.editStudent = function(x) {
        $scope.s = angular.copy(x);
        $scope.edit = true;
    };

    // Delete student
    $scope.deleteStudent = function(id) {
        $http.delete('/api/students/' + id).then(function() {
            $scope.msg = 'Student deleted';
            $scope.load();
        })
    };
    // Clear form
    $scope.clear = function() {
        $scope.s = {};
        $scope.edit = false;
    };

    $scope.load();
});
</script>

</body>
</html>
